name: Build Passwall

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: x86_64
            sdk: https://downloads.openwrt.org/releases/25.12.4/targets/x86/64/openwrt-sdk-25.12.4-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.xz

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Prepare OpenWrt SDK
      uses: openwrt/gh-action-sdk@main
      with:
        sdk: ${{ matrix.target.sdk }}
        feeds: |
          src-git luci https://github.com/openwrt/luci
          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages
        packages: |
          luci-app-passwall

    - name: Build packages
      run: |
        make defconfig
        make package/luci-app-passwall/compile V=sc

    - name: Upload to Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: passwall-${{ matrix.target.name }}-${{ github.run_number }}
        name: Passwall (${{ matrix.target.name }})
        files: bin/packages/**/*.ipk
        token: ${{ secrets.GITHUB_TOKEN }}
